name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path dist\windows\CodexAutoRetry.exe,dist\windows\config.default.json,dist\windows\install_windows.ps1 -DestinationPath dist\CodexAutoRetry-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexAutoRetry-windows-x64
          path: dist/CodexAutoRetry-windows-x64.zip
